<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Motor Manufacturing ERP</title>
  </head>
  <body>
    <div id="root">
      <div style="font-family: Arial, sans-serif; padding: 32px;">
        <h1>EV Motor Manufacturing ERP</h1>
        <p>Loading the application...</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || !root.textContent.includes('Loading the application')) return;
        root.innerHTML = '<div style="font-family: Arial, sans-serif; padding: 32px;"><h1>EV Motor Manufacturing ERP</h1><p>The application script could not load. Please refresh the page.</p></div>';
        console.error(event.message || 'Browser script error');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
